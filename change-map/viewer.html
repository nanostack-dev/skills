<title>Change map</title>
<style>
/* Layout: a review desk. Main column reads top to bottom in approval order; the rail holds where-the-lines-are, navigation and the review tally. */
:root {
  --canvas: #f7f8fa; --surface: #ffffff; --subtle: #f0f2f5; --hover: #e9edf3; --border: #dfe3e9;
  --text: #202631; --muted: #5d6776; --accent: #2456c7; --accent-soft: #eaf0ff; --on-accent: #ffffff;
  --success: #166441; --success-soft: #e5f4eb; --warning: #80520a; --warning-soft: #fff2d6;
  --danger: #b3293a; --danger-soft: #fcebed; --violet: #6541b8; --violet-soft: #f0eafd;
  --shadow: 0 18px 64px #18243b24;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --r: 8px; --r-sm: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #141619; --surface: #1b1e23; --subtle: #24282f; --hover: #2d333c; --border: #363e49;
  --text: #edf0f4; --muted: #a5afbd; --accent: #9fbaff; --accent-soft: #263455; --on-accent: #15264b;
  --success: #8bd6aa; --success-soft: #193a2b; --warning: #f1c574; --warning-soft: #3b301b;
  --danger: #ffacb6; --danger-soft: #41272d; --violet: #c9b3ff; --violet-soft: #2e2745;
  --shadow: 0 18px 64px #00000070; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #141619; --surface: #1b1e23; --subtle: #24282f; --hover: #2d333c; --border: #363e49;
  --text: #edf0f4; --muted: #a5afbd; --accent: #9fbaff; --accent-soft: #263455; --on-accent: #15264b;
  --success: #8bd6aa; --success-soft: #193a2b; --warning: #f1c574; --warning-soft: #3b301b;
  --danger: #ffacb6; --danger-soft: #41272d; --violet: #c9b3ff; --violet-soft: #2e2745;
  --shadow: 0 18px 64px #00000070; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
p code, li code, td code, .txt code { background: var(--subtle); padding: 1px 5px; border-radius: var(--r-sm); overflow-wrap: anywhere; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
@media (max-width: 640px) { .top { position: static; } }
.crumb { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.top h1 { font-size: 15px; font-weight: 600; flex: 1 1 280px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--subtle); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.good { background: var(--success-soft); color: var(--success); }
.warn { background: var(--warning-soft); color: var(--warning); }
.bad { background: var(--danger-soft); color: var(--danger); }
.info { background: var(--accent-soft); color: var(--accent); }
.vio { background: var(--violet-soft); color: var(--violet); }

.page { max-width: 1320px; margin: 0 auto; padding-block: 20px 64px; padding-inline: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); display: grid; gap: 12px; }
main { display: grid; gap: 28px; min-width: 0; }
main, .rail, .brief, .schema, .watch, .rules, .tally, .dec, .flow, .steps, .tx, .legend { grid-template-columns: minmax(0, 1fr); }
section { min-width: 0; }
@media (max-width: 980px) { .page { grid-template-columns: minmax(0, 1fr); } .rail { position: static; order: -1; } }

.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.pad { padding: 14px 16px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
section > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
section > header h2 { font-size: 17px; font-weight: 650; }
section > header .hint { color: var(--muted); font-size: 13px; }

.brief { display: grid; gap: 12px; }
.brief .txt { font-size: 15px; line-height: 1.6; max-width: 78ch; margin: 0; }
.ask { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--accent-soft); border-radius: var(--r); color: var(--text); }
.ask b { color: var(--accent); white-space: nowrap; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }

.lines .big { font-size: 22px; font-weight: 650; }
.lines .sub { color: var(--muted); font-size: 12px; }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--subtle); margin: 10px 0 8px; }
.bar i { display: block; height: 100%; min-width: 2px; }
.legend { display: grid; gap: 3px; font-size: 12px; }
.legend div { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 8px; align-items: center; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .skip { color: var(--muted); }
.legend .n { color: var(--muted); font-family: var(--mono); font-size: 11px; }

nav.toc { display: grid; gap: 1px; padding: 8px; }
nav.toc a { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: var(--r-sm); color: var(--text); font-size: 13px; }
nav.toc a:hover { background: var(--hover); text-decoration: none; }
nav.toc a span { color: var(--muted); font-size: 12px; }

.tally { display: grid; gap: 10px; }
.tally .row { display: flex; justify-content: space-between; font-size: 13px; }
.meter { height: 6px; background: var(--subtle); border-radius: 999px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.state-line { font-size: 13px; font-weight: 600; }
.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 550; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.dec { display: grid; gap: 8px; padding: 14px 16px; align-content: start; }
.dec.agreed { border-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
.dec.asked { border-color: color-mix(in srgb, var(--warning) 55%, var(--border)); }
.dec-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.dec h3 { font-size: 14.5px; font-weight: 650; line-height: 1.35; }
.dec .txt { margin: 0; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
.kv dd { margin: 0; min-width: 0; }
.refs { display: flex; gap: 6px; flex-wrap: wrap; }
.ref { font: 11.5px var(--mono); padding: 2px 6px; border-radius: var(--r-sm); background: var(--subtle); color: var(--muted); white-space: nowrap; }
.ref:hover { color: var(--accent); text-decoration: none; background: var(--accent-soft); }
.choice { display: flex; gap: 6px; padding-top: 4px; border-top: 1px solid var(--border); margin-top: 2px; padding-top: 10px; }
.choice button { flex: 1; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 550; color: var(--muted); }
.choice button:hover { background: var(--hover); color: var(--text); }
.choice button[aria-pressed="true"].yes { background: var(--success-soft); border-color: transparent; color: var(--success); }
.choice button[aria-pressed="true"].no { background: var(--warning-soft); border-color: transparent; color: var(--warning); }
textarea { width: 100%; min-height: 56px; resize: vertical; font: 13px/1.45 var(--sans); color: var(--text); background: var(--subtle); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }

.watch { display: grid; }
.w { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; align-items: start; border-top: 1px solid var(--border); }
.w:first-child { border-top: 0; }
.w h3 { font-size: 14px; font-weight: 600; }
.w .txt { margin: 3px 0 6px; font-size: 13.5px; color: var(--text); }
.w .sev { justify-self: start; }
.w .flag { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; color: var(--muted); white-space: nowrap; }
.w .flag[aria-pressed="true"] { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
@media (max-width: 640px) { .w { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

.model { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .model { grid-template-columns: minmax(0, 1fr); } }
.diagram { overflow-x: auto; padding: 12px; }
.diagram svg { display: block; margin: 0 auto; max-width: none; }
.diagram text { font-family: var(--sans); }
.foot { font-size: 12px; color: var(--muted); padding: 0 16px 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.foot i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; border: 1.5px solid var(--muted); vertical-align: -1px; margin-right: 5px; }
.foot i.dash { border-style: dashed; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.c { text-align: center; }
.cell { display: inline-block; min-width: 38px; text-align: center; padding: 1px 7px; border-radius: var(--r-sm); font: 600 11.5px var(--mono); }

.schema { display: grid; gap: 12px; }
.tcard > .th { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tcard .tn { font: 600 13.5px var(--mono); }
.tcard .tnote { color: var(--muted); font-size: 12.5px; flex-basis: 100%; }
.flags { display: flex; gap: 4px; flex-wrap: wrap; }
.flag-chip { font: 600 10.5px var(--mono); padding: 1px 5px; border-radius: var(--r-sm); background: var(--subtle); color: var(--muted); white-space: nowrap; }
.flag-chip.pk { background: var(--accent-soft); color: var(--accent); }
.flag-chip.fk { background: var(--violet-soft); color: var(--violet); }
.flag-chip.uq { background: var(--warning-soft); color: var(--warning); }
td.coln { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
td.type { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
td.cn { color: var(--muted); font-size: 12.5px; min-width: 180px; }
.notes { display: grid; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 13px; }
.notes div { display: flex; gap: 8px; }
.notes div::before { content: "•"; color: var(--muted); }

.flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr)); gap: 12px; }
.flow { padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start; }
.flow h3 { font-size: 14px; font-weight: 650; }
.flow .actor { font-size: 12px; color: var(--muted); margin-top: 1px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.step { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; padding: 4px 6px; border-radius: 6px; position: relative; }
.step .dot { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 600 10px var(--mono); margin-top: 1px; }
.step .err { display: block; font: 11px var(--mono); color: var(--danger); margin-top: 1px; overflow-wrap: anywhere; }
.tx { border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--border)); border-radius: 8px; padding: 18px 2px 2px; position: relative; display: grid; gap: 4px; }
.tx::before { content: "one transaction"; position: absolute; top: 2px; left: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
.flow .res { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
.kinds { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.kinds span { display: inline-flex; gap: 5px; align-items: center; }
.kinds b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.m { display: inline-block; min-width: 50px; text-align: center; font: 700 10.5px var(--mono); padding: 2px 6px; border-radius: var(--r-sm); }
.m.GET { background: var(--success-soft); color: var(--success); }
.m.POST { background: var(--accent-soft); color: var(--accent); }
.m.PUT, .m.PATCH { background: var(--warning-soft); color: var(--warning); }
.m.DELETE { background: var(--danger-soft); color: var(--danger); }
td.path { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.prefix { font: 12px var(--mono); color: var(--muted); padding: 10px 12px 0; overflow-wrap: anywhere; }

.rules { display: grid; }
.rule { border-top: 1px solid var(--border); }
.rule:first-child { border-top: 0; }
.rule summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 11px 16px; cursor: pointer; align-items: center; }
.rule summary::-webkit-details-marker { display: none; }
.rule summary:hover { background: var(--hover); }
.rule .rt { font-weight: 600; font-size: 13.5px; }
.rule .how { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.rule ul { margin: 0; padding: 0 16px 12px 32px; font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.rule ul b { color: var(--text); font-weight: 550; }
.count { font: 600 12px var(--mono); padding: 2px 8px; border-radius: 999px; }

.bucket { border-top: 1px solid var(--border); }
.bucket:first-child { border-top: 0; }
.bucket summary { list-style: none; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 16px; cursor: pointer; font-size: 13.5px; }
.bucket summary::-webkit-details-marker { display: none; }
.bucket summary:hover { background: var(--hover); }
.bucket .files { padding: 0 16px 10px; display: grid; gap: 1px; }
.file { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font: 12px var(--mono); padding: 2px 0; }
.file span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.plus { color: var(--success); } .minus { color: var(--danger); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--text); color: var(--canvas); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 20; }
.copybox { width: 100%; min-height: 160px; font: 12px/1.45 var(--mono); }
@media (prefers-reduced-motion: no-preference) { .dec, .choice button, .w .flag { transition: border-color .15s, background .15s, color .15s; } }
</style>

<div class="top"><div class="top-in" id="top"></div></div>
<div class="page">
  <main id="main"></main>
  <aside class="rail" id="rail"></aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*CHANGE_MAP_DATA*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const fmt = n => Number(n || 0).toLocaleString("en-US");
const has = v => Array.isArray(v) ? v.length > 0 : v && typeof v === "object" ? Object.keys(v).length > 0 : !!v;

const BUCKET_COLOR = { generated: "var(--border)", tests: "var(--muted)", schema: "var(--violet)", contract: "var(--warning)", logic: "var(--accent)", wiring: "var(--success)", docs: "var(--danger)" };
const KIND = {
  read: ["Read", "var(--subtle)", "var(--muted)"], lock: ["Lock", "var(--warning-soft)", "var(--warning)"],
  guard: ["Guard", "var(--danger-soft)", "var(--danger)"], write: ["Write", "var(--success-soft)", "var(--success)"],
  emit: ["Emit", "var(--violet-soft)", "var(--violet)"], call: ["Call", "var(--accent-soft)", "var(--accent)"],
};
const SEV = { risk: ["Risk", "bad"], question: ["Question", "warn"], nit: ["Nit", "plain"], note: ["Note", "info"] };

function refLink(ref) {
  const m = String(ref).match(/^(.*?)(?::(\d+)(?:-(\d+))?)?$/);
  const [, path, a, b] = m;
  const meta = DATA.meta || {};
  const label = path.split("/").pop() + (a ? ":" + a : "");
  let href = "#";
  if (meta.repo && meta.sha) href = `https://github.com/${meta.repo}/blob/${meta.sha}/${path}${a ? `#L${a}${b ? `-L${b}` : ""}` : ""}`;
  return `<a class="ref" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(ref)}">${esc(label)}</a>`;
}
const refs = list => has(list) ? `<div class="refs">${list.map(refLink).join("")}</div>` : "";

function humanTest(name) {
  const go = name.match(/^Test([A-Za-z0-9]+?)(?:_(.+))?$/);
  if (!go) return { group: "", text: name.replace(/^test_/, "").replace(/_/g, " ") };
  const words = s => s.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2").toLowerCase();
  const group = words(go[1]);
  return { group: group.charAt(0).toUpperCase() + group.slice(1), text: go[2] ? words(go[2]) : "" };
}
const allTests = () => (DATA.tests || []).flatMap(t => t.names.map(n => ({ name: n, file: t.file })));

let store = {};
const KEY = () => `change-map:${DATA.meta?.repo}#${DATA.meta?.number ?? DATA.meta?.head}:${DATA.meta?.sha || ""}`;
function load() { try { store = JSON.parse(localStorage.getItem(KEY()) || "{}"); } catch { store = {}; } }
function save() { try { localStorage.setItem(KEY(), JSON.stringify(store)); } catch {} }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 1800); }

function renderTop() {
  const m = DATA.meta || {}, v = DATA.verdict || {};
  const ci = { passing: ["CI passing", "good"], failing: ["CI failing", "bad"], running: ["CI running", "warn"], none: ["No CI", ""] }[m.ci] || null;
  const risk = { low: "good", medium: "warn", high: "bad" }[v.risk];
  const id = m.kind === "wip" ? `${m.repo || ""} · ${m.head} → ${m.base}` : `${m.repo} #${m.number}`;
  $("#top").innerHTML = `
    <span class="crumb">${esc(id)}</span>
    <h1 title="${esc(m.title)}">${esc(m.title)}</h1>
    <div class="pills">
      ${m.stack ? `<span class="pill plain info">stack ${esc(m.stack)}</span>` : ""}
      ${m.state === "wip" ? `<span class="pill vio">work in progress</span>` : m.state && m.state !== "open" ? `<span class="pill">${esc(m.state)}</span>` : ""}
      ${ci ? `<span class="pill ${ci[1]}">${ci[0]}</span>` : ""}
      ${v.risk ? `<span class="pill ${risk}">${esc(v.risk)} risk</span>` : ""}
      ${v.door ? `<span class="pill ${v.door === "one-way" ? "warn" : "good"}" title="${esc(v.doorNote || "")}">${esc(v.door)} door</span>` : ""}
    </div>`;
}

function section(id, title, hint, body, count) {
  return { id, title, count, html: `<section id="${id}"><header><h2>${esc(title)}</h2>${hint ? `<span class="hint">${md(hint)}</span>` : ""}</header>${body}</section>` };
}

function sBrief() {
  const m = DATA.meta || {}, v = DATA.verdict || {};
  const links = (m.links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`);
  if (m.url) links.unshift(`<a href="${esc(m.url)}" target="_blank" rel="noopener">Open on GitHub</a>`);
  const body = `<div class="brief">
    <p class="txt">${md(DATA.summary)}</p>
    ${v.ask ? `<div class="ask"><b>You approve</b><span>${md(v.ask)}</span></div>` : ""}
    ${v.doorNote ? `<div class="txt" style="font-size:13px;color:var(--muted)">${md(v.doorNote)}</div>` : ""}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}</div>`;
  return section("brief", "What this change does", "", body);
}

function sDecisions() {
  const list = DATA.decisions || [];
  if (!list.length) return null;
  const cards = list.map(d => {
    const st = store[d.id] || {};
    return `<article class="box dec ${st.v === "yes" ? "agreed" : st.v === "no" ? "asked" : ""}" data-id="${esc(d.id)}">
      <div class="dec-head"><h3>${md(d.title)}</h3>${d.tag ? `<span class="pill plain">${esc(d.tag)}</span>` : ""}</div>
      ${d.choice ? `<p class="txt">${md(d.choice)}</p>` : ""}
      <dl class="kv">
        ${d.why ? `<dt>Why</dt><dd>${md(d.why)}</dd>` : ""}
        ${d.instead ? `<dt>Not</dt><dd>${md(d.instead)}</dd>` : ""}
        ${d.cost ? `<dt>Cost</dt><dd>${md(d.cost)}</dd>` : ""}
      </dl>
      ${refs(d.refs)}
      <div class="choice">
        <button class="yes" aria-pressed="${st.v === "yes"}" data-act="yes">Agree</button>
        <button class="no" aria-pressed="${st.v === "no"}" data-act="no">Question it</button>
      </div>
      <textarea id="note-${esc(d.id)}" placeholder="What should the author answer?" ${st.v === "no" ? "" : "hidden"}>${esc(st.note || "")}</textarea>
    </article>`;
  }).join("");
  return section("decisions", "Decisions to approve", "Agree or question each one. This is the review.", `<div class="grid2">${cards}</div>`, list.length);
}

function sWatch() {
  const list = DATA.watch || [];
  if (!list.length) return null;
  const rows = list.map((w, i) => {
    const id = w.id || `w${i}`; const sev = SEV[w.sev] || SEV.note; const on = store[id]?.v === "no";
    return `<div class="w" data-id="${esc(id)}">
      <span class="pill ${sev[1]} sev">${sev[0]}</span>
      <div><h3>${md(w.title)}</h3>${w.body ? `<p class="txt">${md(w.body)}</p>` : ""}${refs(w.ref ? [].concat(w.ref) : [])}</div>
      <button class="flag" aria-pressed="${on}" data-act="flag">${on ? "In review" : "Add to review"}</button>
    </div>`;
  }).join("");
  return section("watch", "Worth a look", "What a careful reviewer would open. Everything else is covered below.", `<div class="box watch">${rows}</div>`, list.length);
}

function stateSvg(model) {
  const states = model.states || [], trans = model.transitions || [];
  if (!states.length) return "";
  const col = {}; col[states[0].id] = 0;
  for (let pass = 0; pass < states.length; pass++)
    for (const [a, b] of trans) if (col[a] !== undefined && col[b] === undefined && a !== b) col[b] = col[a] + 1;
  states.forEach(s => { if (col[s.id] === undefined) col[s.id] = 1; });
  const cols = {}; states.forEach(s => (cols[col[s.id]] ||= []).push(s));
  const W = 132, H = 46, GX = 120, GY = 44, PAD = 40;
  const maxRows = Math.max(...Object.values(cols).map(c => c.length));
  const height = PAD * 2 + maxRows * H + (maxRows - 1) * GY + 10;
  const ncols = Object.keys(cols).length;
  const width = PAD * 2 + ncols * W + (ncols - 1) * GX;
  const pos = {};
  Object.entries(cols).forEach(([c, list]) => {
    const total = list.length * H + (list.length - 1) * GY;
    list.forEach((s, i) => pos[s.id] = { x: PAD + c * (W + GX), y: (height - total) / 2 + i * (H + GY) + 5 });
  });
  let edges = "", labels = "";
  trans.forEach(([a, b, label]) => {
    const p = pos[a], q = pos[b]; if (!p || !q) return;
    if (a === b) {
      const x = p.x + W / 2, y = p.y;
      edges += `<path d="M${x - 22},${y} C${x - 30},${y - 38} ${x + 30},${y - 38} ${x + 22},${y}" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ah)"/>`;
      labels += `<text x="${x}" y="${y - 34}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(label)}</text>`;
      return;
    }
    const x1 = p.x + W, y1 = p.y + H / 2, x2 = q.x - 4, y2 = q.y + H / 2, mx = (x1 + x2) / 2;
    edges += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ah)"/>`;
    const ly = (y1 + y2) / 2 + (y2 < y1 ? -6 : y2 > y1 ? 14 : -6);
    labels += `<rect x="${mx - label.length * 3.3 - 6}" y="${ly - 12}" width="${label.length * 6.6 + 12}" height="17" rx="4" fill="var(--surface)"/><text x="${mx}" y="${ly}" text-anchor="middle" font-size="11.5" fill="var(--text)">${esc(label)}</text>`;
  });
  const nodes = states.map((s, i) => {
    const p = pos[s.id]; const tone = s.tone || (i === 0 ? "accent" : "muted");
    const stroke = { accent: "var(--accent)", good: "var(--success)", bad: "var(--danger)", warn: "var(--warning)", muted: "var(--muted)" }[tone];
    const fill = { accent: "var(--accent-soft)", good: "var(--success-soft)", bad: "var(--danger-soft)", warn: "var(--warning-soft)", muted: "var(--subtle)" }[tone];
    return `<g><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="1.6" ${s.derived ? 'stroke-dasharray="5 4"' : ""}/>
      <text x="${p.x + W / 2}" y="${p.y + (s.note ? 20 : 28)}" text-anchor="middle" font-size="13.5" font-weight="650" fill="var(--text)">${esc(s.label || s.id)}</text>
      ${s.note ? `<text x="${p.x + W / 2}" y="${p.y + 36}" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="var(--muted)">${esc(s.note)}</text>` : ""}
      ${i === 0 ? `<circle cx="${p.x - 20}" cy="${p.y + H / 2}" r="5" fill="var(--text)"/><path d="M${p.x - 14},${p.y + H / 2} L${p.x - 4},${p.y + H / 2}" stroke="var(--text)" stroke-width="1.4" marker-end="url(#ah)"/>` : ""}</g>`;
  }).join("");
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="State diagram of ${esc(model.entity || "the entity")}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
    ${edges}${labels}${nodes}</svg>`;
}

function cellTone(v) {
  const s = String(v);
  if (/^(ok|yes|allowed|✓)$/i.test(s)) return "good";
  if (/^(—|-|n\/a)$/.test(s)) return "";
  if (/^[45]\d\d/.test(s) || /^(no|refused)$/i.test(s)) return "bad";
  return "warn";
}

function sModel() {
  const m = DATA.model;
  if (!has(m)) return null;
  const ops = m.ops;
  const matrix = has(ops) ? `<div class="box"><div class="tbl-wrap"><table>
      <thead><tr><th>Operation</th>${ops.cols.map(c => `<th class="c" style="text-align:center">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${ops.rows.map(r => `<tr><td>${md(r[0])}</td>${r.slice(1).map(v => `<td class="c"><span class="cell ${cellTone(v)}">${esc(v)}</span></td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>${ops.note ? `<div class="foot" style="padding-top:8px">${md(ops.note)}</div>` : ""}</div>` : "";
  const derived = (m.states || []).some(s => s.derived);
  const body = `<div class="model">
    <div class="box"><div class="diagram">${stateSvg(m)}</div>
      <div class="foot"><span><i></i>stored</span>${derived ? `<span><i class="dash"></i>derived on read</span>` : ""}${m.note ? `<span>${md(m.note)}</span>` : ""}</div></div>
    ${matrix}</div>`;
  return section("model", `${m.entity || "Entity"} lifecycle`, m.hint || "States and what each operation does in each state.", body);
}

function flagChips(flags) {
  return (flags || "").split(/\s*,\s*/).filter(Boolean).map(f => {
    const cls = /^pk/i.test(f) ? "pk" : /^fk|→|->/.test(f) ? "fk" : /^(unique|uq)/i.test(f) ? "uq" : "";
    return `<span class="flag-chip ${cls}">${esc(f)}</span>`;
  }).join("");
}

function sSchema() {
  const s = DATA.schema;
  if (!has(s)) return null;
  const cards = (s.tables || []).map(t => `<div class="box tcard">
    <div class="th"><span class="tn">${esc(t.name)}</span>${t.new ? `<span class="pill good">new table</span>` : t.change ? `<span class="pill warn">${esc(t.change)}</span>` : ""}${t.file ? refLink(t.file) : ""}${t.note ? `<span class="tnote">${md(t.note)}</span>` : ""}</div>
    ${has(t.cols) ? `<div class="tbl-wrap"><table><thead><tr><th>Column</th><th>Type</th><th>Keys</th><th>Meaning</th></tr></thead><tbody>
      ${t.cols.map(([n, ty, fl, note]) => `<tr><td class="coln">${esc(n)}</td><td class="type">${esc(ty)}</td><td><div class="flags">${flagChips(fl)}</div></td><td class="cn">${md(note || "")}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    ${has(t.idx) ? `<div class="tbl-wrap" style="border-top:1px solid var(--border)"><table><thead><tr><th>Index</th><th>On</th><th>Serves</th></tr></thead><tbody>
      ${t.idx.map(([n, on, why]) => `<tr><td class="coln">${esc(n)}</td><td class="type">${esc(on)}</td><td class="cn">${md(why || "")}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    ${has(t.notes) ? `<div class="notes">${t.notes.map(n => `<div><span>${md(n)}</span></div>`).join("")}</div>` : ""}
  </div>`).join("");
  return section("schema", "Schema", s.hint || "", `<div class="schema">${cards}</div>`);
}

function sFlows() {
  const list = DATA.flows || [];
  if (!list.length) return null;
  const stepHtml = (st, i) => {
    const k = KIND[st.k] || KIND.call;
    return `<li class="step"><span class="dot" style="background:${k[1]};color:${k[2]}">${i + 1}</span><span>${md(st.t)}${st.err ? `<span class="err">${esc(st.err)}</span>` : ""}</span></li>`;
  };
  const cards = list.map(f => {
    const steps = f.steps || []; const [a, b] = f.tx || [];
    let inner = "";
    if (a !== undefined) {
      inner += steps.slice(0, a).map((s, i) => stepHtml(s, i)).join("");
      inner += `<li class="tx"><ol class="steps">${steps.slice(a, b + 1).map((s, i) => stepHtml(s, a + i)).join("")}</ol></li>`;
      inner += steps.slice(b + 1).map((s, i) => stepHtml(s, b + 1 + i)).join("");
    } else inner = steps.map(stepHtml).join("");
    return `<article class="box flow"><div><h3>${md(f.name)}</h3>${f.actor ? `<div class="actor">${md(f.actor)}</div>` : ""}</div>
      <ol class="steps">${inner}</ol>${f.result ? `<div class="res">${md(f.result)}</div>` : ""}</article>`;
  }).join("");
  const used = new Set(list.flatMap(f => (f.steps || []).map(s => s.k)));
  const legend = `<div class="kinds">${Object.entries(KIND).filter(([k]) => used.has(k)).map(([, v]) => `<span><b style="background:${v[1]};outline:1.5px solid ${v[2]}"></b>${v[0]}</span>`).join("")}<span><b style="border:1.5px dashed var(--accent)"></b>Transaction</span></div>`;
  return section("flows", "How it runs", DATA.flowsHint || "One column per operation, in execution order. Red lines are refusals.", `<div class="flows">${cards}</div>${legend}`, list.length);
}

function sApi() {
  const list = DATA.api || [];
  if (!list.length) return null;
  const paths = list.map(r => r.p);
  let prefix = paths.reduce((acc, p) => { let i = 0; while (i < acc.length && acc[i] === p[i]) i++; return acc.slice(0, i); }, paths[0]);
  prefix = prefix.slice(0, prefix.lastIndexOf("/"));
  if (prefix.length < 8) prefix = "";
  const hasEmit = list.some(r => r.emits), hasScope = list.some(r => r.scope);
  const rows = list.map(r => `<tr><td><span class="m ${esc(r.m)}">${esc(r.m)}</span></td><td class="path">${esc(prefix ? "…" + r.p.slice(prefix.length) : r.p)}</td>
    ${hasScope ? `<td class="type">${esc(r.scope || "")}</td>` : ""}${hasEmit ? `<td>${r.emits ? `<span class="pill plain vio">${esc(r.emits)}</span>` : ""}</td>` : ""}<td class="cn">${md(r.note || "")}</td></tr>`).join("");
  const body = `<div class="box">${prefix ? `<div class="prefix">… = ${esc(prefix)}</div>` : ""}<div class="tbl-wrap"><table><thead><tr><th>Method</th><th>Path</th>${hasScope ? "<th>Scope</th>" : ""}${hasEmit ? "<th>Emits</th>" : ""}<th>Note</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  return section("api", "API surface", DATA.apiHint || "", body, list.length);
}

function sRules() {
  const rules = DATA.rules || [], tests = allTests();
  if (!rules.length && !tests.length) return null;
  const matched = new Set();
  const items = rules.map(r => {
    const hits = tests.filter(t => (r.tests || []).some(k => t.name.includes(k)));
    hits.forEach(h => matched.add(h.name));
    const tone = hits.length ? "good" : "bad";
    return `<details class="rule"><summary><div><div class="rt">${md(r.rule)}</div>${r.how ? `<div class="how">${md(r.how)}</div>` : ""}</div>
      <span class="count ${tone}">${hits.length ? hits.length + " test" + (hits.length > 1 ? "s" : "") : "untested"}</span></summary>
      ${hits.length ? `<ul>${hits.map(h => { const x = humanTest(h.name); return `<li><b>${esc(x.group)}</b> ${esc(x.text)}</li>`; }).join("")}</ul>` : ""}</details>`;
  });
  const rest = tests.filter(t => !matched.has(t.name));
  if (rest.length) items.push(`<details class="rule"><summary><div><div class="rt">Other tests</div><div class="how">Not tied to a rule above</div></div><span class="count">${rest.length}</span></summary>
    <ul>${rest.map(h => { const x = humanTest(h.name); return `<li><b>${esc(x.group)}</b> ${esc(x.text)}</li>`; }).join("")}</ul></details>`);
  return section("proof", "Rules and their proof", `${tests.length} tests. Each rule lists the tests that pin it.`, `<div class="box rules">${items.join("")}</div>`, tests.length);
}

function sFiles() {
  const list = DATA.buckets || [];
  if (!list.length) return null;
  const body = list.map(b => `<details class="bucket" ${b.skip ? "" : "open"}><summary>
      <span class="sw" style="width:10px;height:10px;border-radius:3px;background:${BUCKET_COLOR[b.id] || "var(--muted)"}"></span>
      <span>${esc(b.label)} <span style="color:var(--muted)">· ${b.files.length} file${b.files.length > 1 ? "s" : ""}${b.skip ? " · safe to skip" : ""}</span></span>
      <span class="mono num plus">+${fmt(b.add)}</span><span class="mono num minus">−${fmt(b.del)}</span></summary>
      <div class="files">${b.files.map(([p, a, d]) => `<div class="file"><span title="${esc(p)}">${esc(p)}</span><span class="num"><span class="plus">+${fmt(a)}</span> <span class="minus">−${fmt(d)}</span></span></div>`).join("")}</div></details>`).join("");
  return section("files", "Every file", "Grouped by what a reviewer has to do with it.", `<div class="box">${body}</div>`, list.reduce((n, b) => n + b.files.length, 0));
}

function renderRail(sections) {
  const b = DATA.buckets || [];
  const total = b.reduce((n, x) => n + x.add + x.del, 0) || 1;
  const read = b.filter(x => !x.skip).reduce((n, x) => n + x.add + x.del, 0);
  const lines = b.length ? `<div class="box pad lines">
    <div class="label">Where the lines are</div>
    <div style="margin-top:6px"><span class="big num">${fmt(read)}</span> <span class="sub">of ${fmt(total)} lines need a human · ${Math.round(read * 100 / total)}%</span></div>
    <div class="bar">${b.map(x => `<i style="width:${(x.add + x.del) * 100 / total}%;background:${BUCKET_COLOR[x.id] || "var(--muted)"}" title="${esc(x.label)}"></i>`).join("")}</div>
    <div class="legend">${b.map(x => `<div class="${x.skip ? "skip" : ""}"><span class="sw" style="background:${BUCKET_COLOR[x.id] || "var(--muted)"}"></span><span>${esc(x.label)}${x.skip ? " (skip)" : ""}</span><span class="n num">${fmt(x.add + x.del)}</span><span class="n num">${Math.round((x.add + x.del) * 100 / total)}%</span></div>`).join("")}</div>
  </div>` : "";
  const toc = `<nav class="box toc" aria-label="Sections">${sections.map(s => `<a href="#${s.id}">${esc(s.title)}${s.count ? `<span class="num">${s.count}</span>` : ""}</a>`).join("")}</nav>`;
  $("#rail").innerHTML = `${lines}<div class="box pad tally" id="tally"></div>${toc}`;
  renderTally();
}

function renderTally() {
  const decs = DATA.decisions || [];
  const yes = decs.filter(d => store[d.id]?.v === "yes").length;
  const no = decs.filter(d => store[d.id]?.v === "no").length;
  const flagged = (DATA.watch || []).filter((w, i) => store[w.id || `w${i}`]?.v === "no").length;
  const n = decs.length || 1;
  const state = !decs.length ? "" : no || flagged ? `<span style="color:var(--warning)">Request changes · ${no + flagged} to raise</span>` : yes === decs.length ? `<span style="color:var(--success)">Ready to approve</span>` : `${decs.length - yes} decision${decs.length - yes > 1 ? "s" : ""} left to review`;
  $("#tally").innerHTML = `<div class="label">Your review</div>
    ${decs.length ? `<div class="row"><span>Decisions</span><span class="num">${yes} agreed · ${no} questioned · ${decs.length}</span></div>
    <div class="meter"><i style="width:${yes * 100 / n}%;background:var(--success)"></i><i style="width:${no * 100 / n}%;background:var(--warning)"></i></div>` : ""}
    ${(DATA.watch || []).length ? `<div class="row"><span>Flagged for review</span><span class="num">${flagged} of ${DATA.watch.length}</span></div>` : ""}
    <div class="state-line">${state}</div>
    <div class="btns"><button class="btn primary" id="copy">Copy review comment</button><button class="btn" id="reset">Reset</button></div>
    <textarea class="copybox" id="copybox" hidden readonly></textarea>`;
}

function reviewMarkdown() {
  const decs = DATA.decisions || [];
  const qs = decs.filter(d => store[d.id]?.v === "no");
  const ok = decs.filter(d => store[d.id]?.v === "yes");
  const flagged = (DATA.watch || []).filter((w, i) => store[w.id || `w${i}`]?.v === "no");
  const lines = [];
  lines.push(qs.length || flagged.length ? "### Before I approve" : "### Approved");
  qs.forEach(d => lines.push(`- **${d.title}**${store[d.id]?.note ? `: ${store[d.id].note}` : ""}`));
  flagged.forEach(w => lines.push(`- ${w.title}${w.ref ? ` (\`${[].concat(w.ref)[0]}\`)` : ""}`));
  if (ok.length) { lines.push("", `Agreed with ${ok.length} of ${decs.length} decisions:`); ok.forEach(d => lines.push(`- ${d.title}`)); }
  return lines.join("\n");
}

function wire() {
  document.addEventListener("click", async e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const card = btn.closest("[data-id]");
    if (btn.dataset.act === "yes" || btn.dataset.act === "no") {
      const id = card.dataset.id, cur = store[id]?.v;
      store[id] = { ...(store[id] || {}), v: cur === btn.dataset.act ? undefined : btn.dataset.act };
      card.classList.toggle("agreed", store[id].v === "yes"); card.classList.toggle("asked", store[id].v === "no");
      card.querySelectorAll(".choice button").forEach(b => b.setAttribute("aria-pressed", String(store[id].v === b.dataset.act)));
      const ta = card.querySelector("textarea"); ta.hidden = store[id].v !== "no"; if (!ta.hidden) ta.focus();
      save(); renderTally();
    } else if (btn.dataset.act === "flag") {
      const id = card.dataset.id; const on = store[id]?.v !== "no";
      store[id] = { v: on ? "no" : undefined }; btn.setAttribute("aria-pressed", String(on)); btn.textContent = on ? "In review" : "Add to review";
      save(); renderTally();
    } else if (btn.id === "copy") {
      const text = reviewMarkdown();
      try { await navigator.clipboard.writeText(text); toast("Review comment copied"); }
      catch { const box = $("#copybox"); box.value = text; box.hidden = false; box.select(); toast("Select and copy the text below"); }
    } else if (btn.id === "reset") {
      store = {}; save(); render();
    }
  });
  document.addEventListener("input", e => {
    if (e.target.matches(".dec textarea")) { const id = e.target.closest("[data-id]").dataset.id; store[id] = { ...(store[id] || {}), note: e.target.value }; save(); }
  });
}

function render() {
  if (!DATA) { $("#main").innerHTML = `<div class="box pad">No change map data. Build this page with <code>build.py change.json</code>.</div>`; return; }
  load();
  document.title = DATA.meta?.number ? `#${DATA.meta.number} ${DATA.meta.title}` : (DATA.meta?.title || "Change map");
  renderTop();
  const sections = [sBrief(), sDecisions(), sWatch(), sModel(), sSchema(), sFlows(), sApi(), sRules(), sFiles()].filter(Boolean);
  $("#main").innerHTML = sections.map(s => s.html).join("");
  renderRail(sections);
}

render();
wire();
</script>
